<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #111; } .date { color: #888; } }
  h1 { font-size: 1.25rem; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .5rem 0; border-bottom: 1px solid #8884; }
  .days { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .date { display: block; font-size: .8rem; color: #777; }
</style>
</head>
<body>
<h1>Countdown</h1>
<table id="list"></table>
<p id="empty" hidden>Nothing coming up.</p>

<script>
// Edit this list. Give a time with a timezone ("Z" = UTC, or e.g. +01:00);
// a bare date like "2026-12-24" means midnight wherever you are. Past events are hidden.
const EVENTS = [
  ["Christmas Eve",     "2026-12-24"],
  ["New Year",          "2027-01-01"],
  ["PoE 3.30 league",   "2026-11-13T21:00Z"],  // 1 PM PST
  ["PoE 2 1.0 release", "2026-12-11T21:00Z"],  // expected 1 PM PST, not confirmed
];

const parse = s => /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + "T00:00") : new Date(s);
const fmt = new Intl.DateTimeFormat(undefined, {
  weekday: "short", day: "numeric", month: "short", year: "numeric",
  hour: "2-digit", minute: "2-digit", hourCycle: "h23",
});
const pad = n => String(n).padStart(2, "0");

const items = EVENTS
  .map(([name, when]) => ({ name, at: parse(when) }))
  .sort((a, b) => a.at - b.at);

const list = document.getElementById("list");
for (const e of items) {
  e.row = list.insertRow();
  const name = e.row.insertCell();
  name.textContent = e.name;
  const date = document.createElement("span");
  date.className = "date";
  date.textContent = fmt.format(e.at);
  name.append(date);
  e.left = e.row.insertCell();
  e.left.className = "days";
}

function tick() {
  let shown = 0;
  for (const e of items) {
    const s = Math.floor((e.at - Date.now()) / 1000);
    e.row.hidden = s < 0;
    if (s < 0) continue;
    shown++;
    const d = Math.floor(s / 86400);
    e.left.textContent = (d ? d + "d " : "") +
      pad(Math.floor(s / 3600) % 24) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  document.getElementById("empty").hidden = shown > 0;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
