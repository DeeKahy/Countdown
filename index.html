<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #111; } .date { color: #888; } }
  h1 { font-size: 1.25rem; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: .5rem 0; border-bottom: 1px solid #8884; }
  .days { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .date { display: block; font-size: .8rem; color: #777; }
</style>
</head>
<body>
<h1>Countdown</h1>
<table id="list"></table>

<script>
// Edit this list. Dates are YYYY-MM-DD. Past dates are hidden.
const EVENTS = [
  ["Christmas Eve", "2026-12-24"],
  ["New Year",      "2027-01-01"],
];

// Count whole calendar days, ignoring time of day and DST.
const now = new Date();
const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());

const rows = EVENTS
  .map(([name, date]) => {
    const [y, m, d] = date.split("-").map(Number);
    return { name, date, days: Math.round((Date.UTC(y, m - 1, d) - today) / 86400000) };
  })
  .filter(e => e.days >= 0)
  .sort((a, b) => a.days - b.days);

const list = document.getElementById("list");
for (const e of rows) {
  const tr = list.insertRow();
  const name = tr.insertCell();
  name.textContent = e.name;
  const date = document.createElement("span");
  date.className = "date";
  date.textContent = e.date;
  name.append(date);
  const days = tr.insertCell();
  days.className = "days";
  days.textContent = e.days === 0 ? "today" : e.days === 1 ? "1 day" : e.days + " days";
}
if (!rows.length) list.insertRow().insertCell().textContent = "Nothing coming up.";
</script>
</body>
</html>
